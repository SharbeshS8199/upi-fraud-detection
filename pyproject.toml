[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "upi-fraud"
version = "0.1.0"
description = "UPI / credit-card fraud detection: imbalance handling, model comparison, explanations, real-time API"
authors = [{ name = "Sharbesh S" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.0", "scikit-learn>=1.4", "joblib>=1.3", "matplotlib>=3.8"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.36", "plotly>=5.20"]
full = ["xgboost>=2.0", "shap>=0.45", "imbalanced-learn>=0.12", "torch>=2.2"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8"]

[project.urls]
Author = "https://github.com/SharbeshS8199"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
filterwarnings = ["ignore::UserWarning"]
